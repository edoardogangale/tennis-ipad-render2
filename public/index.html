<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tennis iPad Reborn</title><style>
:root{--bg:#07111f;--panel:rgba(8,18,32,.78);--line:#eef7ff;--gold:#ffd166;--blue:#5da9ff}*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:white}canvas{position:fixed;inset:0;width:100%;height:100%}.layer{position:fixed;z-index:5}.hidden{display:none!important}#lobby{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#18395c,#07111f 62%)}.card{width:min(560px,92vw);padding:34px;border:1px solid #ffffff22;border-radius:28px;background:var(--panel);backdrop-filter:blur(18px);text-align:center;box-shadow:0 24px 80px #0008}.title{font-size:clamp(48px,11vw,88px);font-weight:900;letter-spacing:.12em;background:linear-gradient(#fff,#78b9ff);color:transparent;background-clip:text}.sub{opacity:.6;letter-spacing:.18em;font-size:11px;margin:4px 0 28px}.input{width:100%;padding:15px;border:1px solid #ffffff1f;border-radius:14px;background:#ffffff0d;color:white;font-size:17px;outline:none;text-align:center}.courts{display:flex;gap:8px;margin:14px 0}.court{flex:1;padding:12px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff09;color:white;font-weight:800}.court.sel{border-color:var(--gold);box-shadow:0 0 24px #ffd16622}.go{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#2f9e72,#5da9ff);color:white;font-weight:900;letter-spacing:.12em;font-size:15px}.hud{top:10px;left:50%;transform:translateX(-50%);min-width:270px;padding:10px 16px;border-radius:18px;background:var(--panel);border:1px solid #ffffff20;backdrop-filter:blur(16px);text-align:center}.score{font:800 15px ui-monospace,monospace;letter-spacing:.08em}.meta{font-size:10px;opacity:.55;margin-top:3px}.controls{inset:0;pointer-events:none}.joy{position:absolute;left:20px;bottom:20px;width:190px;height:190px;border:2px solid #ffffff22;border-radius:50%;background:#ffffff08;pointer-events:auto}.knob{position:absolute;width:76px;height:76px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,#fff,#6baeff 45%,#1d4f91);box-shadow:0 12px 28px #0008}.shots{position:absolute;right:20px;bottom:20px;width:250px;height:250px;pointer-events:auto}.shot{position:absolute;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:10px;border:1px solid #ffffff30;box-shadow:0 12px 25px #0008}.drive{right:0;top:84px;background:#e64d5a}.lob{left:84px;top:0;background:#3b9e64}.drop{left:84px;bottom:0;background:#d8dce1;color:#111}.slice{left:0;top:84px;background:#3e7fbe}.serve{right:22px;bottom:280px;width:190px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid #ffffff22;pointer-events:auto}.serve button{width:100%;padding:13px;border:0;border-radius:12px;background:#3c9b77;color:white;font-weight:900}.serve select{width:100%;margin-bottom:8px;padding:8px;border-radius:10px;background:#12263e;color:white}.full{position:absolute;right:18px;top:18px;padding:10px 13px;border:1px solid #ffffff22;border-radius:12px;background:var(--panel);color:white;font-weight:800;pointer-events:auto}.toast{top:40%;left:50%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;text-shadow:0 8px 30px #000;opacity:0;transition:.2s}.toast.on{opacity:1}
@media(max-width:760px){.joy{width:155px;height:155px}.knob{width:62px;height:62px}.shots{width:205px;height:205px}.shot{width:68px;height:68px}.drive{top:68px}.slice{top:68px}.lob,.drop{left:68px}.serve{right:10px;bottom:220px;width:160px}.full{top:70px}.card{padding:24px}}
</style></head><body><canvas id="game"></canvas>
<div id="lobby" class="layer"><div class="card"><div class="title">TENNIS</div><div class="sub">MULTIPLAYER · 3D · IPAD FIRST</div><input id="name" class="input" maxlength="14" placeholder="Il tuo nome"><div class="courts"><button class="court sel" data-court="hard">CEMENTO</button><button class="court" data-court="clay">TERRA</button><button class="court" data-court="grass">ERBA</button></div><div id="status" class="meta" style="margin:12px 0 0;min-height:18px">Scegli il campo e entra.</div><button id="go" class="go">ENTRA IN PARTITA</button></div></div>
<div id="hud" class="layer hud hidden"><div id="score" class="score">A 0 · 0 — B 0 · 0</div><div id="meta" class="meta">1v1 · CEMENTO</div></div>
<div id="full" class="layer full hidden">FULLSCREEN</div><div id="toast" class="layer toast"></div>
<div id="controls" class="layer controls hidden"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div id="shots" class="shots"><div class="shot drive" data-shot="drive">DRIVE</div><div class="shot lob" data-shot="lob">LOB</div><div class="shot drop" data-shot="drop">DROP</div><div class="shot slice" data-shot="slice">SLICE</div></div><div id="serve" class="serve hidden"><select id="serveType"><option value="flat">PIATTO</option><option value="slice">SLICE</option><option value="kick">KICK</option></select><button id="serveBtn">TIENI · SERVI</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
'use strict';const socket=io();let myId=null,myTeam=null,isEmbrando=false,court='hard',state=null,selectedCourt='hard';
const $=id=>document.getElementById(id), lobby=$('lobby'),controls=$('controls'),serve=$('serve'),full=$('full'),toast=$('toast');
for(const b of document.querySelectorAll('.court'))b.onclick=()=>{document.querySelectorAll('.court').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selectedCourt=b.dataset.court;};
$('go').onclick=()=>socket.emit('join',{name:$('name').value.trim()||'Player',court:selectedCourt});
socket.on('joined',d=>{myId=d.id;myTeam=d.team;isEmbrando=!!d.isEmbrando;lobby.classList.add('hidden');controls.classList.remove('hidden');if(isEmbrando)full.classList.remove('hidden');$('meta').textContent='IN ATTESA DELL’AVVERSARIO…';});
socket.on('state',s=>{state=s;renderHUD();process(s.events||[]);serve.classList.toggle('hidden',!(s.phase==='serving'&&s.serverId===myId));if(s.phase==='lobby'&&myId)$('meta').textContent='IN ATTESA DELL’AVVERSARIO…';if(s.phase==='serving'&&s.serverId===myId)$('meta').textContent='SEI AL SERVIZIO · scegli il tipo e servi';if(s.phase==='serving'&&s.serverId!==myId)$('meta').textContent='RICEVI · resta dietro la linea di servizio';});
function renderHUD(){if(!state)return;const s=state.score;const l=s.labels||{A:'0',B:'0'};$('score').textContent=`A ${l.A} · ${s.games.A} — ${s.games.B} · ${l.B} B`;if(state.phase!=='lobby'&&state.phase!=='serving')$('meta').textContent=`${state.court.toUpperCase()} · ${state.phase==='rally'?'RALLY':state.phase.toUpperCase()}`;}
function process(events){for(const e of events){if(e.type==='point')show((e.team===myTeam?'PUNTO':'PUNTO AVVERSARIO'));if(e.type==='game')show('GAME');if(e.type==='set')show('SET');if(e.type==='match')show(e.team===myTeam?'VITTORIA':'MATCH');if(e.type==='fault')show('FAULT');if(e.type==='tiebreak')show('TIE-BREAK');}}
function show(t){toast.textContent=t;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),700);}
full.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();}catch(e){}};
let joyPointer=null,joyCenter={x:0,y:0},lastInput=0;
$('joy').addEventListener('pointerdown',e=>{joyPointer=e.pointerId;const r=$('joy').getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};$('joy').setPointerCapture(e.pointerId);moveJoy(e);});
$('joy').addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveJoy(e);});
$('joy').addEventListener('pointerup',endJoy);$('joy').addEventListener('pointercancel',endJoy);
function moveJoy(e){let dx=e.clientX-joyCenter.x,dy=e.clientY-joyCenter.y,r=$('joy').clientWidth*.38,m=Math.hypot(dx,dy)||1;if(m>r){dx*=r/m;dy*=r/m;}$('knob').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const now=performance.now();if(now-lastInput>30){socket.emit('input',{mx:dx/r,mz:dy/r});lastInput=now;}}
function endJoy(e){if(joyPointer!==e.pointerId)return;joyPointer=null;$('knob').style.transform='translate(-50%,-50%)';socket.emit('input',{mx:0,mz:0});}
let charging=null;
for(const b of document.querySelectorAll('.shot')){b.addEventListener('pointerdown',e=>{charging={button:b,shot:b.dataset.shot,started:performance.now()};b.setPointerCapture(e.pointerId);b.classList.add('held');socket.emit('chargeStart');});b.addEventListener('pointerup',e=>releaseShot());b.addEventListener('pointercancel',e=>releaseShot());}
function releaseShot(){if(!charging)return;const c=charging;charging=null;c.button.classList.remove('held');const charge=Math.max(.12,Math.min(1,(performance.now()-c.started)/900));const joy=$('knob').getBoundingClientRect(),jr=$('joy').getBoundingClientRect();const ax=Math.max(-1,Math.min(1,(joy.left+joy.width/2-(jr.left+jr.width/2))/(jr.width*.38)));socket.emit('shot',{shot:c.shot,charge,angle:{x:ax,y:0}});}
$('serveBtn').addEventListener('pointerdown',()=>{socket.emit('chargeStart');$('serveBtn').dataset.held='1';});$('serveBtn').addEventListener('pointerup',()=>{socket.emit('shot',{serveType:$('serveType').value,charge:.8,angle:{x:0,y:0}});$('serveBtn').dataset.held='0';});
const renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color('#07111f');const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,7,-21);const amb=new THREE.HemisphereLight('#b9ddff','#07111f',2);scene.add(amb);const sun=new THREE.DirectionalLight('#ffffff',2.3);sun.position.set(4,10,-5);scene.add(sun);
const courtGroup=new THREE.Group();scene.add(courtGroup);let courtMeshes=[];
function rebuildCourt(type){for(const m of courtMeshes)courtGroup.remove(m);courtMeshes=[];const colors={hard:['#2456a8','#10264d'],clay:['#b34a22','#5e2810'],grass:['#2e8b43','#16441f']}[type];const base=new THREE.Mesh(new THREE.BoxGeometry(12,0.25,28),new THREE.MeshStandardMaterial({color:colors[1],roughness:1}));base.position.y=-.15;courtGroup.add(base);courtMeshes.push(base);const surface=new THREE.Mesh(new THREE.BoxGeometry(11,0.08,24),new THREE.MeshStandardMaterial({color:colors[0],roughness:.95}));surface.position.y=.01;courtGroup.add(surface);courtMeshes.push(surface);const mat=new THREE.LineBasicMaterial({color:'#ffffff'});function line(x1,z1,x2,z2){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,.07,z1),new THREE.Vector3(x2,.07,z2)]);const l=new THREE.Line(g,mat);courtGroup.add(l);courtMeshes.push(l);}line(-5.485,-11.885,5.485,-11.885);line(-5.485,11.885,5.485,11.885);line(-5.485,-11.885,-5.485,11.885);line(5.485,-11.885,5.485,11.885);line(-4.115,-11.885,-4.115,11.885);line(4.115,-11.885,4.115,11.885);line(-4.115,-6.4,4.115,-6.4);line(-4.115,6.4,4.115,6.4);line(0,-6.4,0,6.4);}
rebuildCourt('hard');
const ball=new THREE.Mesh(new THREE.SphereGeometry(.22,20,20),new THREE.MeshStandardMaterial({color:'#d9ff72',emissive:'#587a20',emissiveIntensity:.5}));scene.add(ball);const players3D=new Map();function playerMesh(p){let g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.9,6,10),new THREE.MeshStandardMaterial({color:p.color}));body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,14),new THREE.MeshStandardMaterial({color:'#f0c7a4'}));head.position.y=1.55;g.add(head);scene.add(g);players3D.set(p.id,g);return g;}
function frame(){requestAnimationFrame(frame);if(state){if(state.court!==court){court=state.court;rebuildCourt(court);}for(const p of state.players){let g=players3D.get(p.id)||playerMesh(p);g.position.x += (p.x-g.position.x)*.28;g.position.z += (p.z-g.position.z)*.28;g.rotation.y += (Math.atan2(p.vx,p.vz)-g.rotation.y)*.18;}for(const [id,g] of players3D)if(!state.players.find(p=>p.id===id)){scene.remove(g);players3D.delete(id);}if(state.ball){ball.visible=true;ball.position.x += (state.ball.x-ball.position.x)*.42;ball.position.y += (state.ball.y-ball.position.y)*.42;ball.position.z += (state.ball.z-ball.position.z)*.42;}else ball.visible=false;const me=state.players.find(p=>p.id===myId);const targetX=me?me.x*.22:0;const targetZ=me?me.z*.12-3:-3;camera.position.x+=(targetX-camera.position.x)*.04;camera.position.z+=((-21+targetZ)-camera.position.z)*.025;camera.lookAt(me?me.x*.18:0,1.0,me?me.z*.10:0);}renderer.render(scene,camera);}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
